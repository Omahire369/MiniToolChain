name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The full matrix on Linux: every configuration has to be green, because
  # warning and sanitizer behaviour is not configuration-independent (see
  # docs/development-log.md, 2026-08-30).
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, ubsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          CXX: g++-13
      - name: Build
        run: cmake --build build/${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        if: matrix.preset != 'release'
      - name: Benchmarks compile and run
        run: ./build/${{ matrix.preset }}/benchmarks/bench_toolchain 5
        if: matrix.preset == 'release'

  # The toolchain claims to build on MSVC and on Clang; CI is what keeps that
  # true rather than aspirational.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build build/debug
      - name: Test
        run: ctest --preset debug

  # A build with no network access at all, proving the "no dependencies" claim
  # in ADR-010 rather than asserting it.
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13
      # `unshare -r` creates a new user namespace to get root inside it, which
      # is what lets an unprivileged runner also unshare the network namespace
      # (-n). Ubuntu 24.04 blocks that via AppArmor by default (see `man
      # unshare`'s AppArmor notes) -- the runner has passwordless sudo, so
      # relaxing it for this job is simpler than emulating the restriction.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure and build with networking disabled
        run: |
          cmake --preset debug
          unshare -r -n cmake --build build/debug
        env:
          CXX: g++-13
      - name: Test
        run: ctest --preset debug

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: clang-format changes its line breaking between major versions,
      # so an unpinned tool turns a green tree red on an unrelated upgrade.
      # The codebase is formatted with exactly this version.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find include src tests benchmarks \
            \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-tidy g++-13
      - name: Configure
        run: cmake --preset debug
        env:
          CXX: g++-13
      - name: Run clang-tidy
        run: |
          find include src -name '*.hpp' -o -name '*.cpp' -print0 \
            | xargs -0 clang-tidy -p build/debug

  # The golden fixtures must match what this build produces. If they do not,
  # either a format changed or something changed it by accident — and the
  # difference between those is a decision, not a merge.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13
      - name: Build
        run: |
          cmake --preset release
          cmake --build build/release
        env:
          CXX: g++-13
      - name: Fixtures are unchanged
        run: ./build/release/tests/test_golden_binaries
      - name: Output is identical on a second build
        run: |
          ./build/release/src/minitool build examples/hello.asm -o /tmp/a.mexe
          ./build/release/src/minitool build examples/hello.asm -o /tmp/b.mexe
          cmp /tmp/a.mexe /tmp/b.mexe
